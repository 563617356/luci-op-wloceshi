name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: '创建 Release 并上传 ipk/apk'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: protobuf 引擎测试
        run: python3 tests/test_wloc_proto.py

      - name: addon 集成测试
        run: python3 tests/test_wloc_addon.py

      - name: 地图适配层测试
        run: node tests/test_map_adapter.js

      - name: 地图链接解析测试
        run: node tests/test_link_parser.js

  build:
    name: ${{ matrix.version }} ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK 文件名由下载步骤从目录索引动态发现（文件名含 gcc 版本，
          # 且 24.10+ 用 .tar.zst、23.05- 用 .tar.xz，硬编码必然失效）。
          #
          # arch 必须用各版本真实存在的名字。已逐一核对目录确认：
          #   x86-64              所有版本
          #   armsr-armv8         23.05 起（22.03 无此 subtarget）
          #   armvirt-64          仅 22.03（23.05 起改名）
          #   qualcommax-ipq807x  24.10/25.12（23.05 无 qualcommax 目录）
          - version: '25.12.5'
            arch: x86-64
            sdk_subtarget: x86/64
          - version: '25.12.5'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
          - version: '25.12.5'
            arch: qualcommax-ipq807x
            sdk_subtarget: qualcommax/ipq807x
          - version: '24.10.8'
            arch: x86-64
            sdk_subtarget: x86/64
          - version: '24.10.8'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
          - version: '24.10.8'
            arch: qualcommax-ipq807x
            sdk_subtarget: qualcommax/ipq807x
          - version: '23.05.6'
            arch: x86-64
            sdk_subtarget: x86/64
          - version: '23.05.6'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
          - version: '22.03.7'
            arch: x86-64
            sdk_subtarget: x86/64
          - version: '22.03.7'
            arch: armvirt-64
            sdk_subtarget: armvirt/64

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: openwrt
          # 只按 SDK 坐标做 key——不混入源码 hash，否则改一行代码就重下 1GB SDK
          key: sdk-${{ matrix.version }}-${{ matrix.arch }}

      - name: 下载并解压 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_VERSION: ${{ matrix.version }}
          SDK_SUBTARGET: ${{ matrix.sdk_subtarget }}
          SDK_ARCH: ${{ matrix.arch }}
        run: |
          set -eu

          BASE="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_SUBTARGET}"

          # SDK 文件名随版本变化很大：
          #   24.10+ : openwrt-sdk-<ver>-<arch>_gcc-<ver>_musl.Linux-x86_64.tar.zst
          #   23.05- : openwrt-sdk-<ver>-<arch>_gcc-<ver>_musl.Linux-x86_64.tar.xz
          # 硬编码必然随 OpenWrt 升级而失效，因此从目录索引中动态发现。
          NAME="$(curl -fsSL --retry 3 "$BASE/" \
            | grep -o "openwrt-sdk-[^\"]*\.tar\.\(zst\|xz\)" \
            | grep -- "-${SDK_ARCH}_" \
            | head -n1 || true)"

          if [ -z "$NAME" ]; then
            echo "::error::在 $BASE/ 下未找到 ${SDK_ARCH} 的 SDK 包"
            echo "可访问 $BASE/ 查看实际文件名"
            exit 1
          fi

          URL="$BASE/$NAME"
          echo "SDK: $NAME"
          curl -fsSL --retry 3 -o sdk.tar "$URL"

          mkdir -p openwrt
          case "$NAME" in
            *.tar.zst) tar --zstd -xf sdk.tar -C openwrt --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk.tar -C openwrt --strip-components=1 ;;
            *) echo "::error::未知压缩格式: $NAME"; exit 1 ;;
          esac
          rm -f sdk.tar

          test -f openwrt/Makefile || { echo "::error::SDK 解压异常"; exit 1; }
          echo "SDK 就绪: $(cat openwrt/include/version.mk 2>/dev/null | head -n1 || echo ok)"

      - name: 更新 feeds
        run: |
          set -eu
          cd openwrt
          ./scripts/feeds update -a

      - name: 接入本仓库为本地 feed
        run: |
          set -eu

          # ---- 准备界面包目录 ----
          # luci.mk 从 CURDIR 读取 htdocs/ luasrc/ root/，并按目录名
          # 推导包名。本仓库 luci/ 下只有 Makefile，其余资源在根目录，
          # 因此必须逐项复制，否则得到只含 Makefile 的空壳包
          # （能编译能安装，但界面完全空白）。
          STAGE="$RUNNER_TEMP/wloc-feed"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/luci-app-wloc"

          cp "$GITHUB_WORKSPACE/luci/Makefile" "$STAGE/luci-app-wloc/"
          cp -r "$GITHUB_WORKSPACE/htdocs"      "$STAGE/luci-app-wloc/"
          cp -r "$GITHUB_WORKSPACE/luasrc"      "$STAGE/luci-app-wloc/"
          cp -r "$GITHUB_WORKSPACE/root"        "$STAGE/luci-app-wloc/"

          # ---- 准备运行时主包目录 ----
          mkdir -p "$STAGE/luci-app-wloc-mitm"
          cp "$GITHUB_WORKSPACE/Makefile" "$STAGE/luci-app-wloc-mitm/"
          cp "$GITHUB_WORKSPACE/LICENSE"  "$STAGE/luci-app-wloc-mitm/"
          cp -r "$GITHUB_WORKSPACE/root"  "$STAGE/luci-app-wloc-mitm/"

          echo "=== 界面包 ==="
          ls "$STAGE/luci-app-wloc/"
          echo "=== 主包 ==="
          ls "$STAGE/luci-app-wloc-mitm/"

          # 逐项校验，缺什么直接点名
          for f in \
            "$STAGE/luci-app-wloc/Makefile" \
            "$STAGE/luci-app-wloc/htdocs/luci-static/resources/view/wloc.js" \
            "$STAGE/luci-app-wloc/htdocs/luci-static/resources/view/wloc.css" \
            "$STAGE/luci-app-wloc/luasrc/controller/wloc.lua" \
            "$STAGE/luci-app-wloc/root/usr/share/rpcd/acl.d/luci-app-wloc.json" \
            "$STAGE/luci-app-wloc/root/usr/share/luci/menu.d/luci-app-wloc.json" \
            "$STAGE/luci-app-wloc-mitm/Makefile" \
            "$STAGE/luci-app-wloc-mitm/root/usr/libexec/wloc/wloc_proto.py" \
            "$STAGE/luci-app-wloc-mitm/root/usr/libexec/wloc/wloc_addon.py" \
            "$STAGE/luci-app-wloc-mitm/root/usr/bin/wloc-ctl" \
            "$STAGE/luci-app-wloc-mitm/root/etc/init.d/wloc" \
            "$STAGE/luci-app-wloc-mitm/root/etc/config/wloc"
          do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "包文件校验通过（12 项）"

          # ---- 注册为本地 feed ----
          # 用 src-link（而非 src-git）：指向本地目录，不需要 git 源。
          # 这是 OpenWrt 官方支持的方式。
          cd openwrt
          echo "src-link wloc $STAGE" >> feeds.conf.default
          ./scripts/feeds update wloc
          ./scripts/feeds install -y \
            luci-app-wloc luci-app-wloc-mitm luci-base

          echo "=== 安装结果 ==="
          ls -d package/feeds/wloc/* 2>/dev/null || {
            echo "::error::feed 未生效，package/feeds/wloc 为空"
            ls -la package/feeds/ 2>/dev/null || true
            exit 1
          }

      - name: 准备构建配置
        run: |
          set -eu
          cd openwrt
          # make download 依赖 .config 展开包列表；没有 .config 时
          # 新版 SDK 会遍历全部包而失败。写入最小配置并 defconfig。
          printf '%s\n' \
            'CONFIG_ALL_NONSHARED=n' \
            'CONFIG_ALL_KMODS=n' \
            'CONFIG_ALL=n' \
            'CONFIG_SIGNED_PACKAGES=n' \
            'CONFIG_DEVEL=n' \
            'CONFIG_AUTOREMOVE=n' \
            'CONFIG_BUILD_TESTING=n' > .config
          make defconfig >/dev/null
          echo "配置条目: $(grep -c '^CONFIG_' .config || true)"

      - name: 校验包已被 make 识别
        run: |
          set -eu
          cd openwrt
          # 关键校验：确认 make 真的把本包纳入了包列表。
          # 之前多次失败（No rule to make target）都是因为包没被识别，
          # 而挂载步骤的文件校验全部通过——文件在 ≠ make 认。
          #
          # luci.mk 会生成 luci-i18n-* 附属包，这里一并放行。
          for p in luci-app-wloc luci-app-wloc-mitm; do
            if grep -q "^CONFIG_PACKAGE_${p}=" .config; then
              echo "已识别: $(grep "^CONFIG_PACKAGE_${p}=" .config)"
            else
              echo "::error::make 未识别 $p"
              echo "--- .config 中 wloc 条目 ---"
              grep -i wloc .config || echo "  (完全没有)"
              echo "--- package/feeds/wloc ---"
              ls -la package/feeds/wloc/ 2>/dev/null || echo "  目录不存在"
              echo "--- feeds.conf ---"
              grep -i wloc feeds.conf.default 2>/dev/null || echo "  feeds.conf 未包含 wloc"
              echo "--- feeds/wloc ---"
              ls -la feeds/wloc/ 2>/dev/null || echo "  feeds/wloc 不存在"
              exit 1
            fi
          done

      - name: 下载依赖源码
        run: |
          set -eu
          cd openwrt
          # 只下载编译本包真正需要的依赖，避免全量拉取。
          # 先尝试整包 download（快路径），失败则退回逐包。
          if ! make package/luci-app-wloc/download \
                     package/luci-app-wloc-mitm/download -j"$(nproc)"; then
            echo "::warning::整包 download 失败，改用全量 download"
            make download -j"$(nproc)" || {
              echo "::error::download 失败，日志尾部："
              ls -la dl/ 2>/dev/null | head -n 20 || true
              exit 1
            }
          fi
          echo "dl/ 中文件数: $(ls dl/ 2>/dev/null | wc -l)"

      - name: 编译
        run: |
          set -eu
          cd openwrt
          # 用包名而非路径做目标，OpenWrt 会自行解析到 package/feeds/wloc/ 下。
          # 路径形式在 src-link feed 下不稳定（软链解析），包名更可靠。
          make package/luci-app-wloc/compile      V=s -j"$(nproc)"
          make package/luci-app-wloc-mitm/compile V=s -j"$(nproc)"

      - name: 收集产物
        if: always()
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          # ipk 与 apk 一并收集，具体格式体现在文件名里
          find openwrt/bin -type f \
            \( -name 'luci-app-wloc_*.ipk' -o -name 'luci-app-wloc_*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true
          echo
          echo "=== 产物 ==="
          ls -la "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || echo "  无产物"

      - name: 诊断
        if: always()
        run: |
          set -u
          cd openwrt 2>/dev/null || exit 0
          echo "=== OpenWrt 版本 ==="
          grep -E '^(VERSION_|SUBTARGET|TARGET_ARCHPACKAGE)' include/version.mk 2>/dev/null || true
          echo
          echo "=== feeds 状态 ==="
          for d in feeds/*/; do
            [ -d "$d/.git" ] && echo "  ok   $d" || echo "  MISS $d"
          done
          echo
          echo "=== 本包是否被 feeds 识别 ==="
          ls -la package/feeds/wloc/ 2>/dev/null || echo "  package/feeds/wloc 不存在"
          echo
          echo "=== dl/ 文件数 ==="
          ls dl/ 2>/dev/null | wc -l
          echo
          echo "=== .config ==="
          [ -f .config ] && echo "  存在，条目 $(grep -c '^CONFIG_' .config)" || echo "  不存在"
          echo
          echo "=== bin/ 产物 ==="
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | head -n 10 || echo "  无"
          echo
          echo "=== 磁盘 ==="
          df -h . | tail -n1

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-wloc-${{ matrix.version }}-${{ matrix.arch }}
          path: artifacts/*
          # 编译失败时不额外报错，诊断步骤的输出才是关键信息
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
